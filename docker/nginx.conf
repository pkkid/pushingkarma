# Access log with any apikey url argument redacted (in the request line and the referer,
# which carries the page url on asset requests), so api keys never land in the logs
map $request $redacted_request {
  "~^(?<pre>.*[?&]apikey=)[^&\s]*(?<post>.*)$" "${pre}REDACTED${post}";
  default $request;
}
map $http_referer $redacted_referer {
  "~^(?<pre>.*[?&]apikey=)[^&]*(?<post>.*)$" "${pre}REDACTED${post}";
  default $http_referer;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$redacted_request" '
                    '$status $body_bytes_sent "$redacted_referer" "$http_user_agent"';

# Serve HTTPS non-www domain (static, django).
server {
  listen 80;
  listen [::]:80;
  server_name pushingkarma.com;
  access_log /var/log/nginx/access.log redacted;
  add_header Strict-Transport-Security "max-age=31536000";
  
  location /static/notes/PushingKarma/ { alias /notes/PushingKarma/_static/; }
  location /static/notes/Private/ {
    auth_request /_auth_check;
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000";
    alias /notes/Private/_static/;
  }
  location = /_auth_check {
    internal;
    proxy_pass http://unix:/tmp/daphne.sock:/api/main/auth_check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /static/ { alias /app/_dist/static/; }
  location / {
    proxy_pass http://unix:/tmp/daphne.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Cloudflare terminates HTTPS; pass the original scheme so Django's
    # request.is_secure() works (api keys are only accepted over HTTPS)
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
