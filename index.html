<!DOCTYPE html>
<!-- ┌─┐┬ ┬┌─┐┬ ┬┬┌┐┌┌─┐┬┌─┌─┐┬─┐┌┬┐┌─┐ -->
<!-- ├─┘│ │└─┐├─┤│││││ ┬├┴┐├─┤├┬┘│││├─┤ -->
<!-- ┴  └─┘└─┘┴ ┴┴┘└┘└─┘┴ ┴┴ ┴┴└─┴ ┴┴ ┴ -->
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <link id='favicon' rel='icon' href='/static/img/favicon.ico'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>PushingKarma</title>
  </head>
  <body class='leftnav' style='min-height:100vh; margin:0px; background-color:#111;'>
    <script>
      // Paint the cached new tab wallpaper before the app loads (see vue/views/newtab/cache.js)
      try {
        var wallpaper = location.pathname.startsWith('/newtab') && JSON.parse(localStorage.getItem('newtab.wallpaper'))
        if (wallpaper) { document.body.style.background = `#000 url(${wallpaper}) no-repeat center / cover` }
      } catch { /* storage unavailable */ }
    </script>
    <div id='app'></div>
    <script type='module' src='/vue/main.js'></script>
  </body>
</html>
